                        {weeklyPlans.length === 0 && !showAdd && <p className="text-center text-slate-400 text-sm mt-10">No active weekly plans.</p>}
                    </div>
                </div>
            )
        }

        // --- STUDY CALENDAR + INSIGHTS (derived only from saved sessions) ---
        const StudyCalendarView = ({onBack}) => { const {sessions}=useContext(AppContext); const today=getTodayString(); const [monthDate,setMonthDate]=useState(()=>parseLocalDate(today)||new Date()); const [selectedDate,setSelectedDate]=useState(today); const key=`${monthDate.getFullYear()}-${monthDate.getMonth()}`; const cells=useMemo(()=>{const first=new Date(monthDate.getFullYear(),monthDate.getMonth(),1),last=new Date(monthDate.getFullYear(),monthDate.getMonth()+1,0).getDate(),a=[];for(let i=0;i<first.getDay();i++)a.push(null);for(let d=1;d<=last;d++)a.push(toDateString(new Date(monthDate.getFullYear(),monthDate.getMonth(),d)));while(a.length%7)a.push(null);return a;},[key]); const monthMinutes=useMemo(()=>sessions.filter(s=>{const d=parseLocalDate(s.date);return d&&d.getFullYear()===monthDate.getFullYear()&&d.getMonth()===monthDate.getMonth();}).reduce((a,s)=>a+(Number(s.durationMinutes)||0),0),[sessions,key]); const selected=getSessionMinutes(sessions,selectedDate),sub=getSubjectMinutes(sessions,selectedDate); return <div className="p-4 pt-6 h-full pb-24 overflow-y-auto hide-scrollbar"><div className="flex justify-between mb-4"><button onClick={onBack} className="text-slate-500 font-bold"><i className="ph ph-arrow-left mr-2"></i>Back</button><span className="text-[10px] font-black tracking-widest text-sage-600">STUDY CONSISTENCY</span></div><div className="flex justify-between items-end mb-4"><div><h2 className="text-2xl font-bold">Study Calendar</h2><p className="text-[10px] text-slate-400 mt-1">Daily study hours from saved sessions</p></div><div className="text-right"><div className="text-xl font-black text-sage-600">{formatDuration(monthMinutes)}</div><div className="text-[9px] text-slate-400">this month</div></div></div><Card className="p-3 mb-4"><div className="flex justify-between items-center mb-3"><button onClick={()=>setMonthDate(d=>new Date(d.getFullYear(),d.getMonth()-1,1))} className="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800"><i className="ph ph-caret-left"></i></button><h3 className="font-bold">{monthDate.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3><button onClick={()=>setMonthDate(d=>new Date(d.getFullYear(),d.getMonth()+1,1))} className="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800"><i className="ph ph-caret-right"></i></button></div><div className="grid grid-cols-7 gap-1 mb-1">{['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=><div key={x} className="text-center text-[8px] font-black text-slate-400 py-1">{x}</div>)}</div><div className="grid grid-cols-7 gap-1">{cells.map((date,i)=>date?<button key={date} onClick={()=>setSelectedDate(date)} className={`min-h-[54px] rounded-lg p-1 border ${date===selectedDate?'border-sage-500 bg-sage-50 dark:bg-sage-900/20':'border-transparent bg-slate-50 dark:bg-slate-900/40'} ${date===today?'ring-1 ring-sage-400':''}`}><div className="text-[10px] font-bold">{parseLocalDate(date).getDate()}</div><div className={`text-[9px] font-black mt-1 ${getSessionMinutes(sessions,date)>0?'text-sage-600':'text-slate-300 dark:text-slate-600'}`}>{getSessionMinutes(sessions,date)>0?formatDuration(getSessionMinutes(sessions,date)):'—'}</div></button>:<div key={`e${i}`} className="min-h-[54px]"></div>)}</div></Card><Card className="p-4"><div className="flex justify-between items-start mb-4"><div><p className="text-[10px] font-black uppercase tracking-wider text-slate-400">Selected Day</p><h3 className="font-bold text-lg">{getDateLabel(selectedDate,{weekday:'long',month:'short',day:'numeric',year:'numeric'})}</h3></div><div className="text-right"><div className="text-2xl font-black text-sage-600">{formatDuration(selected)}</div><div className="text-[9px] text-slate-400">total study</div></div></div>{SUBJECTS.map(x=><div key={x} className="mb-3"><div className="flex justify-between text-xs font-semibold mb-1"><span>{x}</span><span>{formatDuration(sub[x])}</span></div><ProgressBar progress={selected?(sub[x]/selected)*100:0} heightClass="h-1.5"/></div>)}{selected===0&&<p className="text-[10px] text-slate-400">No study session is recorded for this date yet.</p>}</Card></div>; };
        const DailyWeeklyInsights = ({sessions}) => { const today=getTodayString(); const [date,setDate]=useState(today); const [start,setStart]=useState(()=>getWeekStart(today)); const days=Array.from({length:7},(_,i)=>addDays(start,i)); const daily=getSessionMinutes(sessions,date), ds=getSubjectMinutes(sessions,date), weekly=days.reduce((a,d)=>a+getSessionMinutes(sessions,d),0); const ws={}; SUBJECTS.forEach(x=>ws[x]=days.reduce((a,d)=>a+getSubjectMinutes(sessions,d)[x],0)); return <><Card className="p-4 mb-4"><div className="flex justify-between items-center mb-3"><div><h3 className="font-bold">Daily Insights</h3><p className="text-[10px] text-slate-400">Recorded study hours by subject</p></div><input type="date" value={date} onChange={e=>setDate(e.target.value)} className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkBorder rounded-lg px-2 py-2 text-[10px]"/></div><div className="text-3xl font-black text-sage-600 mb-3">{formatDuration(daily)}</div>{SUBJECTS.map(x=><div key={x} className="mb-2"><div className="flex justify-between text-xs font-semibold"><span>{x}</span><span>{formatDuration(ds[x])}</span></div><ProgressBar progress={daily?(ds[x]/daily)*100:0} heightClass="h-1.5"/></div>)}{daily===0&&<p className="text-[10px] text-slate-400">No saved study session for this date.</p>}</Card><Card className="p-4 mb-4"><div className="flex justify-between items-center mb-3"><div><h3 className="font-bold">Weekly Insights</h3><p className="text-[10px] text-slate-400">{getDateLabel(start,{month:'short',day:'numeric'})} – {getDateLabel(days[6],{month:'short',day:'numeric',year:'numeric'})}</p></div><div className="flex gap-1"><button onClick={()=>setStart(addDays(start,-7))} className="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800"><i className="ph ph-caret-left"></i></button><button onClick={()=>setStart(addDays(start,7))} className="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800"><i className="ph ph-caret-right"></i></button></div></div><div className="grid grid-cols-2 gap-3 mb-3"><div className="p-3 rounded-xl bg-sage-50 dark:bg-sage-900/20"><p className="text-[9px] uppercase font-black text-slate-400">Total</p><p className="text-xl font-black text-sage-600">{formatDuration(weekly)}</p></div><div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-900/40"><p className="text-[9px] uppercase font-black text-slate-400">Study Days</p><p className="text-xl font-black">{days.filter(d=>getSessionMinutes(sessions,d)>0).length}/7</p></div></div>{days.map(d=><button key={d} onClick={()=>setDate(d)} className="w-full flex items-center gap-3 py-2 border-b border-slate-100 dark:border-darkBorder last:border-0 text-left"><span className="w-20 text-[10px] font-semibold text-slate-500">{getDateLabel(d,{weekday:'short',month:'short',day:'numeric'})}</span><div className="flex-1"><ProgressBar progress={weekly?(getSessionMinutes(sessions,d)/weekly)*100:0} heightClass="h-2"/></div><span className="w-14 text-right text-[10px] font-bold">{formatDuration(getSessionMinutes(sessions,d))}</span></button>)}<div className="mt-3 pt-3 border-t border-slate-100 dark:border-darkBorder">{SUBJECTS.map(x=><div key={x} className="flex justify-between text-xs py-1"><span>{x}</span><b>{formatDuration(ws[x])}</b></div>)}</div></Card></>; };

        // --- 5. MORE VIEW (Analytics, Tests, Mistakes, Settings) ---
        const MoreView = ({ onNavigateToTask }) => {
            const { sessions, tests, mistakes, chapters, settings, updateSettings, addTest, deleteTest, addMistake, deleteMistake, exportData, importData, resetData } = useContext(AppContext);
            const [view, setView] = useState('menu');
            const [showTestForm, setShowTestForm] = useState(false);
            const [showMistakeForm, setShowMistakeForm] = useState(false);
            const [testForm, setTestForm] = useState({ name:'', date:getTodayString(), subject:'All Subjects', marks:'', total:'', mistakes:'', notes:'' });
            const [mistakeForm, setMistakeForm] = useState({ subject:'Physics', chapter:'', question:'', concept:'', solution:'', image:'' });

            const syllabusStats = useMemo(() => {
                const bySubject = {};
                SUBJECTS.forEach(subject => {
                    const list = chapters.filter(c=>c.subject===subject);
                    bySubject[subject] = { total:list.length, completed:list.filter(c=>calculateProgress(c.progress)===100).length, avg:list.length ? Math.round(list.reduce((a,c)=>a+calculateProgress(c.progress),0)/list.length) : 0 };
                });
                const total=chapters.length;
                return { total, completed:chapters.filter(c=>calculateProgress(c.progress)===100).length, avg:total?Math.round(chapters.reduce((a,c)=>a+calculateProgress(c.progress),0)/total):0, bySubject };
            },[chapters]);

            const totalStudyMinutes=sessions.reduce((a,s)=>a+(Number(s.durationMinutes)||0),0);
            const sortedTests=[...tests].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
            const testAverage=tests.length?Math.round(tests.reduce((a,t)=>a+(Number(t.percentage)||0),0)/tests.length):0;
            const bestTest=tests.length?Math.max(...tests.map(t=>Number(t.percentage)||0)):0;

            const submitTest=e=>{
                e.preventDefault();
                const marks=Number(testForm.marks)||0,total=Number(testForm.total)||0;
                if(!testForm.name.trim()||total<=0||marks<0||marks>total)return;
                addTest({...testForm,name:testForm.name.trim(),marks,total,percentage:Math.round((marks/total)*1000)/10,mistakes:Number(testForm.mistakes)||0});
                setTestForm({name:'',date:getTodayString(),subject:'All Subjects',marks:'',total:'',mistakes:'',notes:''}); setShowTestForm(false);
            };
            const submitMistake=e=>{
                e.preventDefault(); if(!mistakeForm.question.trim()&&!mistakeForm.concept.trim())return;
                addMistake({...mistakeForm,question:mistakeForm.question.trim(),concept:mistakeForm.concept.trim(),solution:mistakeForm.solution.trim()});
                setMistakeForm({subject:'Physics',chapter:'',question:'',concept:'',solution:'',image:''}); setShowMistakeForm(false);
            };
            const handleImage=file=>{
                if(!file)return; if(!file.type.startsWith('image/'))return alert('Please attach an image file.'); if(file.size>3*1024*1024)return alert('Image should be 3 MB or smaller.');
                const r=new FileReader(); r.onload=e=>setMistakeForm(prev=>({...prev,image:e.target.result})); r.readAsDataURL(file);
            };

            if(view==='planner')return <SmartPlannerView onBack={()=>setView('menu')} onStartTask={onNavigateToTask}/>;
            if(view==='calendar')return <StudyCalendarView onBack={()=>setView('menu')}/>;
            if(view==='analytics')return <div className="p-4 pt-6 h-full pb-24 overflow-y-auto">
                <button onClick={()=>setView('menu')} className="mb-4 text-slate-500 font-bold"><i className="ph ph-arrow-left mr-2"></i>Back</button>
                <div className="flex justify-between items-start mb-4"><div><p className="text-[10px] font-black tracking-widest text-sage-600">NEET TRACKER PRO</p><h2 className="text-xl font-bold">Analytics</h2></div><div className="text-right"><div className="text-2xl font-black text-sage-600">{formatDuration(totalStudyMinutes)}</div><div className="text-[9px] text-slate-400">total study</div></div></div>
                <Card className="p-4 mb-4"><div className="flex justify-between items-center mb-3"><div><h3 className="font-bold">Syllabus Completion</h3><p className="text-[10px] text-slate-400">{syllabusStats.completed}/{syllabusStats.total} chapters fully complete</p></div><span className="text-2xl font-black text-sage-600">{syllabusStats.avg}%</span></div><ProgressBar progress={syllabusStats.avg} heightClass="h-3"/><div className="grid grid-cols-2 gap-3 mt-4">{SUBJECTS.map(sub=>{const x=syllabusStats.bySubject[sub];return <div key={sub} className="p-3 rounded-xl bg-slate-50 dark:bg-slate-900/50"><div className="flex justify-between text-xs font-bold mb-1"><span>{sub}</span><span>{x.avg}%</span></div><ProgressBar progress={x.avg} heightClass="h-1.5"/><p className="text-[9px] text-slate-400 mt-1">{x.completed}/{x.total} chapters complete</p></div>})}</div></Card>
                <Card className="p-4 mb-4"><h3 className="font-bold mb-3">Study Hours by Subject</h3>{SUBJECTS.map(sub=>{const mins=sessions.filter(x=>x.subject===sub).reduce((a,x)=>a+(Number(x.durationMinutes)||0),0);return <div key={sub} className="mb-3"><div className="flex justify-between text-xs font-semibold mb-1"><span>{sub}</span><span>{formatDuration(mins)}</span></div><ProgressBar progress={totalStudyMinutes?(mins/totalStudyMinutes)*100:0} heightClass="h-2"/></div>})}</Card>
                 <DailyWeeklyInsights sessions={sessions} />
                <Card className="p-4"><h3 className="font-bold mb-3">Test Performance</h3><div className="grid grid-cols-3 gap-2 text-center"><div><b className="text-xl">{tests.length}</b><p className="text-[9px] text-slate-400">Tests</p></div><div><b className="text-xl">{testAverage}%</b><p className="text-[9px] text-slate-400">Average</p></div><div><b className="text-xl">{bestTest}%</b><p className="text-[9px] text-slate-400">Best</p></div></div></Card>
            </div>;

            if(view==='tests')return <div className="p-4 pt-6 h-full pb-24 overflow-y-auto">
                <div className="flex items-center justify-between mb-4"><button onClick={()=>setView('menu')} className="text-slate-500 font-bold"><i className="ph ph-arrow-left mr-2"></i>Back</button><Button onClick={()=>setShowTestForm(v=>!v)} className="text-xs py-2"><i className="ph ph-plus"></i>Add Test</Button></div><h2 className="text-xl font-bold mb-4">Test Tracker</h2>
                {showTestForm&&<Card className="p-4 mb-4"><form onSubmit={submitTest} className="space-y-3"><Input label="Test Name" value={testForm.name} onChange={e=>setTestForm({...testForm,name:e.target.value})} required/><div className="grid grid-cols-2 gap-3"><Input label="Date" type="date" value={testForm.date} onChange={e=>setTestForm({...testForm,date:e.target.value})}/><Select label="Subject" value={testForm.subject} onChange={e=>setTestForm({...testForm,subject:e.target.value})} options={['All Subjects',...SUBJECTS]}/></div><div className="grid grid-cols-3 gap-2"><Input label="Marks" type="number" value={testForm.marks} onChange={e=>setTestForm({...testForm,marks:e.target.value})}/><Input label="Total" type="number" value={testForm.total} onChange={e=>setTestForm({...testForm,total:e.target.value})}/><Input label="Mistakes" type="number" value={testForm.mistakes} onChange={e=>setTestForm({...testForm,mistakes:e.target.value})}/></div><Input label="Notes" value={testForm.notes} onChange={e=>setTestForm({...testForm,notes:e.target.value})}/><Button type="submit" className="w-full">Save Test</Button></form></Card>}
                <div className="grid grid-cols-3 gap-2 mb-4"><Card className="p-3 text-center"><b className="text-lg">{tests.length}</b><p className="text-[9px] text-slate-400">Tests</p></Card><Card className="p-3 text-center"><b className="text-lg">{testAverage}%</b><p className="text-[9px] text-slate-400">Average</p></Card><Card className="p-3 text-center"><b className="text-lg">{bestTest}%</b><p className="text-[9px] text-slate-400">Best</p></Card></div>
                {sortedTests.length===0?<Card className="p-6 text-center text-slate-400">No tests added yet.</Card>:<div className="space-y-3">{sortedTests.map((t,i)=><Card key={t.id} className="p-4"><div className="flex justify-between"><div><h3 className="font-bold">{t.name}</h3><p className="text-[10px] text-slate-400">{formatDate(t.date)} • {t.subject}</p></div><button onClick={()=>confirm('Delete this test?')&&deleteTest(t.id)} className="text-slate-400 hover:text-red-500"><i className="ph ph-trash"></i></button></div><div className="flex justify-between items-end mt-3"><div><span className="text-3xl font-black text-sage-600">{t.percentage}%</span><span className="text-xs text-slate-400 ml-2">{t.marks}/{t.total}</span></div><span className="text-xs text-slate-500">Mistakes: <b>{t.mistakes||0}</b></span></div>{t.notes&&<p className="text-xs text-slate-500 mt-2">{t.notes}</p>}{i<sortedTests.length-1&&<p className="text-[9px] text-slate-400 mt-2">vs previous: {(Number(t.percentage)-Number(sortedTests[i+1].percentage)).toFixed(1)}%</p>}</Card>)}</div>}
            </div>;

            if(view==='mistakes')return <div className="p-4 pt-6 h-full pb-24 overflow-y-auto">
                <div className="flex items-center justify-between mb-4"><button onClick={()=>setView('menu')} className="text-slate-500 font-bold"><i className="ph ph-arrow-left mr-2"></i>Back</button><Button onClick={()=>setShowMistakeForm(v=>!v)} className="text-xs py-2"><i className="ph ph-plus"></i>Add Mistake</Button></div><h2 className="text-xl font-bold mb-4">Mistake Log</h2>
                {showMistakeForm&&<Card className="p-4 mb-4"><form onSubmit={submitMistake} className="space-y-3"><Select label="Subject" value={mistakeForm.subject} onChange={e=>setMistakeForm({...mistakeForm,subject:e.target.value})} options={SUBJECTS}/><Input label="Chapter" value={mistakeForm.chapter} onChange={e=>setMistakeForm({...mistakeForm,chapter:e.target.value})} placeholder="Chapter name"/><Input label="Question / Error" value={mistakeForm.question} onChange={e=>setMistakeForm({...mistakeForm,question:e.target.value})} placeholder="What went wrong?"/><Input label="Concept / Reason" value={mistakeForm.concept} onChange={e=>setMistakeForm({...mistakeForm,concept:e.target.value})} placeholder="Why?"/><Input label="Correct Approach" value={mistakeForm.solution} onChange={e=>setMistakeForm({...mistakeForm,solution:e.target.value})} placeholder="Formula / approach"/><div><label className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Attach Image</label><input type="file" accept="image/*" className="mt-1 block w-full text-xs" onChange={e=>handleImage(e.target.files?.[0])}/>{mistakeForm.image&&<img src={mistakeForm.image} className="mt-2 max-h-48 w-full object-contain rounded-xl border"/>}</div><Button type="submit" className="w-full">Save Mistake</Button></form></Card>}
                {mistakes.length===0?<Card className="p-6 text-center text-slate-400">No mistakes logged yet.</Card>:<div className="space-y-3">{[...mistakes].reverse().map(m=><Card key={m.id} className="p-4"><div className="flex justify-between"><div><p className="text-[10px] font-black uppercase text-red-500">{m.subject}</p><h3 className="font-bold">{m.chapter||'General'}</h3></div><button onClick={()=>confirm('Delete this mistake?')&&deleteMistake(m.id)} className="text-slate-400"><i className="ph ph-trash"></i></button></div>{m.question&&<p className="text-sm mt-2"><b>Question:</b> {m.question}</p>}{m.concept&&<p className="text-xs text-slate-500 mt-1"><b>Reason:</b> {m.concept}</p>}{m.solution&&<p className="text-xs text-sage-700 mt-1"><b>Correct:</b> {m.solution}</p>}{m.image&&<img src={m.image} className="mt-3 max-h-64 w-full object-contain rounded-xl border"/>}</Card>)}</div>}
            </div>;

            return <div className="p-4 pt-8 h-full overflow-y-auto pb-24 flex flex-col"><div className="mb-6 px-1"><p className="text-[10px] font-black tracking-widest text-sage-600">NEET TRACKER PRO</p><h2 className="text-2xl font-bold tracking-tight">More Options</h2></div>
                <div className="mb-3"><Card onClick={()=>setView('calendar')} className="flex items-center gap-4 p-4 cursor-pointer"><div className="w-10 h-10 rounded-full bg-sage-100 text-sage-600 flex items-center justify-center text-xl"><i className="ph-fill ph-calendar"></i></div><div className="flex-1"><h3 className="font-bold text-sm">Study Calendar</h3><p className="text-[10px] text-slate-500">Daily hours & consistency</p></div><i className="ph ph-caret-right text-slate-300"></i></Card></div>
                <div className="grid gap-3 mb-8"><Card onClick={()=>setView('planner')} className="flex items-center gap-4 p-4 cursor-pointer"><div className="w-10 h-10 rounded-full bg-sage-100 text-sage-600 flex items-center justify-center text-xl"><i className="ph-fill ph-calendar-check"></i></div><div className="flex-1"><h3 className="font-bold text-sm">Weekly Target</h3><p className="text-[10px] text-slate-500">Plan & track weekly targets</p></div><i className="ph ph-caret-right text-slate-300"></i></Card><Card onClick={()=>setView('analytics')} className="flex items-center gap-4 p-4 cursor-pointer"><div className="w-10 h-10 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center text-xl"><i className="ph-fill ph-chart-line-up"></i></div><div className="flex-1"><h3 className="font-bold text-sm">Analytics</h3><p className="text-[10px] text-slate-500">Study + syllabus completion</p></div><i className="ph ph-caret-right text-slate-300"></i></Card><Card onClick={()=>setView('tests')} className="flex items-center gap-4 p-4 cursor-pointer"><div className="w-10 h-10 rounded-full bg-purple-50 text-purple-500 flex items-center justify-center text-xl"><i className="ph-fill ph-exam"></i></div><div className="flex-1"><h3 className="font-bold text-sm">Test Tracker</h3><p className="text-[10px] text-slate-500">Marks, %, mistakes & comparison</p></div><i className="ph ph-caret-right text-slate-300"></i></Card><Card onClick={()=>setView('mistakes')} className="flex items-center gap-4 p-4 cursor-pointer"><div className="w-10 h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center text-xl"><i className="ph-fill ph-warning-circle"></i></div><div className="flex-1"><h3 className="font-bold text-sm">Mistake Log</h3><p className="text-[10px] text-slate-500">Save mistakes + attach images</p></div><i className="ph ph-caret-right text-slate-300"></i></Card></div>
                <h3 className="font-bold text-xs uppercase tracking-wider text-slate-400 px-1 mb-2">Settings & Data</h3><Card className="space-y-4"><div className="flex justify-between items-center py-1"><span className="text-sm font-semibold">Dark Mode</span><button onClick={()=>updateSettings({theme:settings.theme==='dark'?'light':'dark'})} className={`w-12 h-6 rounded-full relative ${settings.theme==='dark'?'bg-sage-500':'bg-slate-300'}`}><div className={`w-5 h-5 bg-white rounded-full absolute top-0.5 ${settings.theme==='dark'?'translate-x-6':'translate-x-0.5'}`}></div></button></div><div className="pt-3 border-t border-slate-100 dark:border-darkBorder grid grid-cols-2 gap-2"><Button variant="outline" onClick={exportData} className="text-xs py-2 w-full"><i className="ph ph-download"></i> Backup Data</Button><div><input type="file" id="importFile" accept=".json" className="hidden" onChange={e=>{const file=e.target.files[0];if(file){const r=new FileReader();r.onload=ev=>importData(ev.target.result);r.readAsText(file);}e.target.value=null;}}/><Button variant="outline" onClick={()=>document.getElementById('importFile').click()} className="text-xs py-2 w-full"><i className="ph ph-upload"></i> Restore Data</Button></div></div><Button variant="ghost" onClick={resetData} className="w-full text-red-500 text-xs py-2">Reset App Data</Button></Card><div className="mt-10 text-center pb-4 opacity-50"><p className="text-[10px] font-bold tracking-widest uppercase">NEET TRACKER PRO • CREATED BY SF</p></div>
            </div>;
        }

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [currentView, setCurrentView] = useState('home');
            const [timerPayload, setTimerPayload] = useState(null);

            const handleNavigateToTask = (task) => {
                setTimerPayload(task);
                setCurrentView('study');
            };

            const navItems = [
                { id: 'home', icon: 'ph-house', label: 'Home' },
                { id: 'planner', icon: 'ph-book-open', label: 'Syllabus' },
                { id: 'study', icon: 'ph-timer', label: 'Study' },
                { id: 'more', icon: 'ph-dots-three', label: 'More' }
            ];

            return (
                <div className="relative w-full max-w-md mx-auto bg-cream dark:bg-darkBg h-screen shadow-2xl overflow-hidden flex flex-col">
                    <main className="flex-1 overflow-hidden relative z-0">
                        {currentView === 'home' && <DashboardView onNavigate={setCurrentView} onNavigateToTask={handleNavigateToTask} />}
                        {currentView === 'planner' && <PlannerView />}
                        {currentView === 'study' && <StudyView initialTask={timerPayload} />}
                        {currentView === 'more' && <MoreView onNavigateToTask={handleNavigateToTask} />}
                    </main>

                    <GlobalTimerBar onNavigate={setCurrentView} />

                    <nav className="fixed bottom-0 left-0 right-0 w-full max-w-md mx-auto bg-white/90 dark:bg-darkCard/90 backdrop-blur-lg border-t border-slate-200/50 dark:border-darkBorder z-50 pb-safe">
                        <div className="flex justify-around items-center px-2 py-2">
                            {navItems.map(item => {
                                const isActive = currentView === item.id;
                                return (
                                    <button key={item.id} onClick={() => { setCurrentView(item.id); if(item.id !== 'study') setTimerPayload(null); }} className={`flex flex-col items-center justify-center w-16 h-12 rounded-xl transition-all duration-200 ${isActive ? 'text-sage-600 dark:text-sage-400' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>
                                        <i className={`${isActive ? 'ph-fill' : 'ph'} ${item.icon} text-2xl transition-transform ${isActive ? '-translate-y-0.5' : ''}`}></i>
                                        <span className={`text-[9px] font-bold mt-0.5 tracking-wide ${isActive ? 'opacity-100' : 'opacity-0 h-0 overflow-hidden'}`}>{item.label}</span>
                                    </button>
                                )
                            })}
                        </div>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppProvider><App /></AppProvider>);
    </script>
</body>
</html>
